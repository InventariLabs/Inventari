<div class="party-box">
  <h3>Magazyn źródłowy</h3>
  {% if source_location %}
  <div class="party-name">{{ source_location }}</div>
  {% else %}
  <div style="color:#aaa; font-style:italic;">—</div>
  {% endif %}
</div>
<div class="party-box">
  <h3>Odbiorca</h3>
  {% if partner %}
  <div class="party-name">{{ partner.name }}</div>
  {% if partner.tax_id %}
  <div class="party-detail">NIP: {{ partner.tax_id }}</div>
  {% endif %}
  {% if partner.address %}
  <div class="party-detail">{{ partner.address }}</div>
  {% endif %}
  {% else %}
  <div style="color:#aaa; font-style:italic;">—</div>
  {% endif %}
</div>
