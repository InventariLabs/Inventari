warn_unused_ignores = true
warn_return_any = true


[tool.vulture]
# Dead-code detection.
# Baseline: scripts/vulture-baseline.txt (check_vulture_baseline.py).
# The baseline must trend toward EMPTY — fix findings, don't grandfather them.
# "scripts" is scanned too: a directory outside the gates becomes the place
# rules silently stop applying — a dead parameter lived there because
# vulture never looked. The baseline holds the residue of one-off helpers
# nothing will ever import. Note the flip side: scripts import from app.*,
# so anything a script touches counts as used — scanning the directory
# widens the gate without weakening it for app code.
paths = ["app", "scripts"]
exclude = [
    # NOTE: directory globs must start with "*/" — vulture matches exclude
    # patterns against paths where a literal "app/..." prefix only works for
    # exact files, not for "dir/*" globs.
    "*/migrations/*",
    "*/tests/*",
    # Pure typed-content files: TypedDict keys / Literal tables vulture cannot
    # see being used.
    "app/i18n/_types.py",
    "app/i18n/_email_content.py",
    # Pydantic DTO/schema fields are consumed by (de)serialization, not by
    # attribute access — inherent false positives. Functions still get
    # scanned everywhere else, so real orphans in services are not masked.
    "*/*schemas*.py",
    "*/schemas/*",
    "*/core/contracts/*",
    # SQLAlchemy declarative models: columns/relationships/Enum vocabulary are
    # consumed by the ORM and by string values in DB rows — inherent false
    # positives, same class as schemas (one-time manual review on 2026-08-07:
    # 2 real orphans removed). Module-level helpers defined in
    # models files are NOT scanned anymore — accepted trade-off.
    "*/models.py",
    "*/models/*",
    # Test-only infrastructure: used from tests/conftest (excluded above), so
    # every factory looks orphaned to vulture.
    "app/core/testing.py",
]
# MUST stay at 60: vulture reports unused functions/methods/classes at 60%
# confidence. At 80 the gate would only catch variables
# and imports — orphaned functions (the motivating bug class) would slip.
min_confidence = 60
# FastAPI/Typer/registry: functions wired by decorators or side-effect
# registration are entry points, not dead code. Pydantic validators and
# serializers are invoked by the framework, not called directly.
ignore_decorators = [
    "@*router*.*",
    "@app.*",
    "@*.command*",
    "@pytest.fixture*",
    "@event_bus*",
    "@event.listens_for",
    "@*.on_*",
    "@field_validator",
    "@model_validator",
    "@field_serializer",
    "@*.validator",
]
ignore_names = [
    # TypedDict fields: consumers read them by dict key (module list,
    # the tracking JSON), never by attribute — vulture cannot see that.
    "signature_status",
    "signature_key_id",
    "signature_verified_at",
    # ModuleTrackingEntry keys written by `module upgrade` and read back
    # through the tracking JSON (app/cli/commands_module.py) — dict keys,
    # invisible to both vulture's attribute scan and a whitelist pin.
    "installed_at",
    "inventari_min_version",
    "previous_version",
    "upgraded_at",
    "on_enable",
    "on_disable",
    "system_on_enable",
    "register_routes",
    "get_settings_schema",
    # Pydantic reads this class attribute itself.
    "model_config",
    # Settings fields read only through settings.model_dump() by the startup
    # check that refuses example placeholders (app/config.py): the backend
    # connects through DATABASE_URL and never names them.
    "DB_PASSWORD",
    "PRODUCTS_DB_PASSWORD",
    # PEP 562 module-level hook, invoked implicitly on attribute access.
    "__getattr__",
    # logging.Formatter calls this on every record it renders; no call site of
    # ours to find (UtcFormatter in app/core/logging.py).
    "formatTime",
    # Alembic's hooks: their only caller is migrations/env.py, and
    # "*/migrations/*" is excluded above (app/core/autogenerate_scope.py).
    "include_object",
    "load_model_metadata",
    # Used from app/models/item.py — models are excluded from the vulture
    # scan, so these look orphaned although production code calls them.
    "quantity_as_weight",
    "CONTINUOUS_UOM_CATEGORIES",
    # Same shape, one directory over: the only consumer is
    # app/schemas/label_pool.py, where it is the `pattern=` of a Pydantic
    # field, and "*/schemas/*" is excluded above. The sibling constants in
    # app/core/label_codes.py are not listed here because each of them is
    # also read inside that module, which is what makes this one the
    # exception rather than the rule.
    "LABEL_PREFIX_PATTERN",
    # qrcode.QRCode.box_size is read by the qrcode library itself when
    # rendering; label_print_service assigns it after construction to resize
    # an already-fitted matrix — a public attribute of the library's API, not
    # dead state of ours.
    "box_size",
    # A Pydantic DTO field the router fills after model_validate (it needs the
    # storages' live states): the consumer is the rules page, which reads it
    # from the API response — same class as the schema files excluded above,
    # only the assignment sits in a scanned file.
    "target_location_active",
    # Same class as target_location_active: capacity/warning fields the
    # routers stamp onto responses after model_validate (the capacity side
    # of a (location, product) pair lives in the warehouse module, the
    # reorder side in purchase_orders) — the consumers are the frontend
    # capacity section and the rules/replenishment pages reading the API
    # responses; no backend code reads them back.
    "reorder_max_quantity",
    "reorder_over_capacity",
    "capacity_max_quantity",
    # WebhookDeliveryLog row fields the delivery mechanics write
    # (_webhook_workers.py, webhook_service.py) and the history screen
    # reads through the delivery API — from_attributes reads are dynamic,
    # and both the model and the response schema live in files excluded
    # from the scan, so the writes are all vulture ever sees. Same class
    # as the fields above, only the writer is a worker rather than a
    # router. The gate keeps its teeth here: any other write-only
    # attribute in these files still trips it (verified while landing
    # this entry with a throwaway field), and the sibling delivery_id
    # needs no entry — its name also appears as parameters/keyword
    # arguments in scanned code, which vulture counts as usage.
    "abandon_reason",
    "last_attempt_at",
    # A payload writer declares the schema/model pair its journal keys come
    # from as a module-level constant; the only reader is the snapshot-key
    # exporter (scripts/export_audit_snapshot_keys.py), which parses the
    # declaring file's AST instead of importing it, so no Python-side use
    # exists for vulture to see.
    "AUDIT_PAYLOAD_SCHEMA",
    # Transient document pointers the read path stamps onto the ORM row and
    # ``DocumentSchema`` reads during serialization ("reversed by" on an
    # undone receipt, issue or move). Same class as the schema fields the
    # exclude above covers, only the assignment sits in a scanned service.
    "reversed_by_id",
    "reversed_by_number",
]

# ---------------------------------------------------------------------------
# Mutation testing — on demand only (`make mutate-stock`), never in a gate.
#
# The stock posting path is where a wrong figure costs the most, and coverage
# says only that the code ran. The four modules below are where a quantity,
# a draw, a reservation and a movement are written; the doors (documents,
# stock takes, production runs) call into them. `make mutate-stock` runs
# mutmut over exactly these and the tests that pin them, and the committed
# report is `docs/STOCK_MUTATION_REPORT.md`.
# ---------------------------------------------------------------------------
[tool.mutmut]
source_paths = ["app"]
only_mutate = [
    "app/services/_stock_draw.py",
    "app/services/_stock_quant_ops.py",
    "app/services/_stock_reservation.py",
    "app/services/items/_stock_quant.py",
]
pytest_add_cli_args_test_selection = [
    "tests/integration/test_the_stock_posting_invariants_hold.py",
    "tests/integration/test_a_stock_movement_writes_the_records_and_the_move.py",
    "tests/integration/test_post_movement_writes_the_record.py",
    "tests/integration/test_a_draw_reads_the_records.py",
    "tests/integration/test_a_draw_writes_its_own_moves.py",
    "tests/integration/test_the_draw_honours_the_grain_it_names.py",
    "tests/integration/test_template_removal_strategy_fefo.py",
    "tests/integration/test_a_refusal_names_the_goods_and_the_place.py",
    "tests/integration/test_the_guards_on_stock_are_real.py",
    "tests/integration/test_core_api_reservations.py",
    "tests/integration/test_a_reservation_names_its_own_grain.py",
    "tests/integration/test_a_reservation_holds_the_grain_it_names.py",
    "tests/integration/test_stock_is_taken_from_every_shelf_in_order.py",
    "tests/integration/test_a_group_of_stock_is_locked_through_its_anchor.py",
    "tests/integration/test_the_draws_count_the_records_and_their_holds.py",
    "tests/integration/test_a_hand_typed_quantity_joins_the_ledger.py",
    "tests/integration/test_a_record_change_leaves_its_move_and_its_cost.py",
    "tests/unit/test_an_opening_balance_has_one_writer.py",
    "tests/integration/test_a_card_made_by_an_edit_books_the_shelf.py",
    "tests/integration/test_stock_quant_consistency.py",
]
# The root conftest provisions the worker database and the seed snapshot;
# pytest.ini carries testpaths, markers and the asyncio mode. Mutmut copies
# only source_paths and its own defaults (the tests and the lock files among
# them), so what lies outside those has to be named here.
also_copy = ["conftest.py", "pytest.ini", "migrations"]
# A database test is not fork-safe: the session-scoped sync engine is created
# in the process that would fork the mutants. The fork server keeps pytest
# imports in a child that never runs a test, so every worker starts clean.
process_isolation = "forkserver"
# A mutant that hangs is a survivor, not a reason to wait out the default
# fifteen-times budget of the whole selected suite.
timeout_multiplier = 4.0
timeout_constant = 20.0
