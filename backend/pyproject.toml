[project]
name = "inventari-backend"
version = "0.11.0"
description = "Inventari — Modular Inventory Management API (FastAPI Core)"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.115.0",
    "starlette>=1.3.1",  # the ASGI types and requests the app's own code uses
    "uvicorn[standard]>=0.52.1",
    "gunicorn>=22.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.10",
    "asyncpg>=0.30.0,<1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0,<3.0.0",
    "bcrypt>=4.2.0",
    "cryptography>=50.0.0",  # secrets at rest and module signatures (crypto_service)
    "redis>=5.0.8",
    "pillow>=13.0.0",
    "python-multipart>=0.0.9",
    "nh3>=0.2.0,<1.0.0",
    "email-validator>=2.2.0",
    "qrcode>=8.0",
    "python-barcode>=0.16",
    "pandas>=2.2.2",
    "pyarrow>=17.0.0",
    "openpyxl>=3.1.5",
    "slowapi>=0.1.9",
    "google-genai>=1.0.0",
    "aioboto3>=12.4.0",
    "botocore>=1.40.61",  # the S3 client's error types are matched on in providers/s3
    "typer[all]>=0.27.1",
    "rich>=15.0.0",  # the CLI's own output; typer pulls it in only as a requirement
    "anyascii>=0.3.2",  # ISC; replaces GPL-licensed unidecode
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.0",
    "weasyprint>=70.0",
    "jinja2>=3.1.6",
    "markupsafe>=3.0.3",  # escape() is what keeps a name out of the email's markup
    "sse-starlette>=2.0.0",
    "babel>=2.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    # Only the document and PO tests read a generated PDF back.
    "pypdf>=6.15.0",  # 6.14.x: CVE-2026-71870, CVE-2026-27025 (DoS)
    "ruff>=0.1.5",
    "mypy>=2.3.0,<3.0.0",
    "pytest-xdist>=3.8.0",
    "pre-commit>=3.8.0",
    "vulture>=2.14",
    # Diff-coverage gate on new/changed lines (part of the pre-push gate).
    "diff-cover>=9.0.0",
    # Only the sanitizer shell test parses like a browser: nh3 (html5ever)
    # serializes the browser-implied <tbody> into its output, so the
    # raw-vs-sanitized DOM comparison needs a parser that implies it too.
    "html5lib>=1.1",
    # The property-based stock posting tests: generated sequences of
    # receive, issue, move, count, undo and reservations, with a fixed
    # example budget so the suite stays bounded.
    "hypothesis>=6.150.0",
]

# On demand only: the stock posting mutation run (`make mutate-stock`).
# It is deliberately not part of the pre-push gate, so the tool and the
# time it needs stay out of the normal dev sync.
mutation = [
    "mutmut>=3.8.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
[tool.pytest-asyncio]
asyncio_mode = "auto"

[tool.coverage.run]
# Do not name "greenlet" here. The async ORM runs every statement through
# greenlet_spawn, and the old line tracer, following threads only, lost an
# async endpoint's frame at the first switch: every line past its first
# `await db…` read as never run. "greenlet" fixed that, but it also keeps
# coverage off its sys.monitoring core, and the full suite under --cov took
# twice as long. sys.monitoring records lines by code object rather than by a
# per-thread frame stack, so a greenlet switch loses nothing: without the
# option the report is the same file for file, at half the time.
# tests/unit/test_the_coverage_run_measures_with_sys_monitoring.py holds it.
concurrency = ["thread"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "migrations",
    # `make mutate-stock` keeps its working copy here — a generated tree of
    # mutants and copied tests, gitignored but still on disk. Linting it would
    # report every deliberately broken mutant as a defect (and the tool is not
    # a gate), so the working copy is outside the linter's reach.
    "mutants",
]

# Same as Black.
line-length = 88
indent-width = 4

# The lint target stays 3.13 while the runtime moves to 3.14. On py314 ruff
# turns on UP037 (quoted annotations made redundant by PEP 649) in 150 places
# — a mechanical rewrite that is its own change, not this one. mypy targets
# 3.14, the interpreter the image ships.
target-version = "py313"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# BLE refuses `except Exception` that neither re-raises nor logs the traceback:
# a broad catch that swallows an error says why on the line, as
# `# noqa: BLE001 — <reason>`.
select = ["E4", "E7", "E9", "F", "I", "N", "B", "BLE", "C4", "UP", "S", "C901", "PLR0915"]
ignore = [
    "B008", # Do not perform function call `Depends` in argument defaults (FastAPI standard)
    "E711", # Comparison to `None` should be `cond is None` (SQLAlchemy standard)
    "E712", # Avoid equality comparisons to `True` (SQLAlchemy standard)
]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Cyclomatic complexity guard — the function-level replacement for the removed
# backend file-size limit.
# Existing offenders carry an explicit `# noqa: C901` with a justification.
max-complexity = 15

[tool.ruff.lint.pylint]
# Statement-count guard per function — same role as C901: measure functions,
# not file length. Existing offenders carry an explicit `# noqa: PLR0915`.
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# conftest.py must set settings.TESTING before app imports — late imports are intentional
# conftest sets up schema with raw SQL queries (parameterized via bound params)
"conftest.py" = ["E402", "S608"]
# Abstract base classes use empty methods as default no-ops — not bugs, by design
"app/core/modules.py" = ["B027"]
"app/core/_base_module.py" = ["B027"]
# Intentional abstract base without strict @abstractmethod decorator
"app/core/contributions.py" = ["B024"]
# Tests use assert natively + dummy passwords in fixtures + schema-query text() (parameterized)
"**/tests/**" = ["S101", "S105", "S106", "S107", "S603", "S608"]
"**/test_*.py" = ["S101", "S105", "S106", "S107", "S603", "S608"]
# CLI entrypoints and scripts use subprocess; audited
"app/cli/**" = ["S603", "S607"]
"scripts/**" = ["S603", "S607", "S110", "S112"]
"manage.py" = ["S110", "S112"]
# Production asserts used for type narrowing after explicit None-check above
"app/api/**" = ["S101"]
# random() used for retry jitter, short-code generation, idempotency keys — not crypto
# Try/except-pass in error-recovery paths is intentional; not silent failures
# Assert used for post-None-check type narrowing (Python idiom)
"app/**" = ["S101", "S311", "S110", "S112"]
"seed_demo_data.py" = ["S311", "S110", "S112"]
"seed_load_test_data.py" = ["S311", "S110", "S112"]
# 0.0.0.0 bind-all-interfaces in dev server / docker compose — intentional
# Placeholder/dummy password defaults in non-security contexts (e.g. SMTP placeholders)
"app/config.py" = ["S104", "S105", "S107"]
# Recipe hostname validator references '0.0.0.0' as a string, not a bind
"app/modules/recipes/**" = ["S104"]
# 'bearer' is a JWT standard token type, not a password (false positive)
"app/api/auth/_tokens.py" = ["S105", "S106"]
# Token type literal 'bearer' — JWT standard, not a password (false positive)
"app/schemas/user.py" = ["S105"]
# '__CLEAR__' sentinel — not a password (false positive on field name "secret")
"app/modules/webhooks/webhook_crud_service.py" = ["S105", "S106"]
# SQLAlchemy models use forward references (string annotations) for relationships — F821 is a false positive
"app/models/*.py" = ["F821"]
"app/modules/*/models.py" = ["F821"]

[tool.ruff.format]
# Use single quotes for strings.
quote-style = "single"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas.*", "openpyxl.*", "pyarrow.*", "weasyprint.*", "qrcode.*", "barcode.*", "html5lib.*"]
ignore_missing_imports = true

# Per-module override for `app.core`.
# Enables `mypy app/core` to be gated in CI without forcing strict on the
# whole module. The narrower overrides below add per-leaf-module checks
# (note: use individual strict options, NOT `strict = true` — see
# python/mypy#16387, `strict` leaks to global options when used
# in any [[tool.mypy.overrides]] block).
[[tool.mypy.overrides]]
module = "app.core"
ignore_errors = false

# Strict-like checks for `app.core.contracts.*` (DTOs — leaf
# module, no downstream impact). Uses individual options + glob to avoid
# the mypy #16387 `strict` leak bug.
[[tool.mypy.overrides]]
module = "app.core.contracts.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true

# Strict-like checks for `app.core._base_module.*` (ABC for all
# modules). Uses individual options + glob to avoid the mypy #16387
# `strict` leak bug. Gates future regressions on the BaseModule contract.
[[tool.mypy.overrides]]
module = "app.core._base_module.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true

# Strict-like checks for `app.core.public_api.*` (CoreAPI surface).
# Same strategy as above (individual options + glob, no `strict = true`).
# 36 errors fixed in one pass; CI will gate future regressions.
[[tool.mypy.overrides]]
module = "app.core.public_api.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true

# Strict-like checks for `app.core._interceptor_pipeline.*`
# (runtime-critical pipeline: items/storages/categories lifecycle).
# Same strategy as above (individual options + glob, no `strict = true`).
[[tool.mypy.overrides]]
module = "app.core._interceptor_pipeline.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true

# Strict-like checks for `app.core._event_bus.*`
# (runtime-critical Redis Streams + Pub/Sub event bus).
# Same strategy as above.
[[tool.mypy.overrides]]
module = "app.core._event_bus.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true

# Strict-like checks for the rest of `app/core/*` (catch-all).
# The more specific `app.core.*` overrides above take precedence per
# mypy's "most specific wins" rule. Strategy: same 7 options + glob,
# no `strict = true` (avoids mypy #16387 leak).
[[tool.mypy.overrides]]
module = "app.core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true

# ─── mypy strict — modules ────────────────────────────────────────
# Strategy: each module gets one production override (strict) + one
# tests-dir staging override (`ignore_errors = true`) until its tests
