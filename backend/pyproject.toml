disallow_any_generics = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true

# Strict-like checks for `app.modules.maker.*`
# (BOM/pricing/production module). Same strategy as the other modules
# (individual options + glob, no `strict = true` — mypy#16387).
[[tool.mypy.overrides]]
module = "app.modules.maker.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true

# maker — tests (strict)
