[pytest]
# pytest configuration for Inventari application

# Test paths
# - tests/ contains shared and legacy tests
# - app/ contains the tests that live beside the code they cover: module-local
#   suites under app/modules/*/tests, and the core and service ones beside them
# This is the whole backend selection: the Makefile and CI run pytest without
# paths of their own, so a tests directory outside these roots runs in no gate.
# tests/unit/test_every_test_file_is_collected_by_a_gate.py keeps it that way.
testpaths = tests app

# Test file patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Display options
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --import-mode=importlib
    --durations=10
    # Under -n, an idle worker takes half of the busiest worker's queue: the
    # default `load` scheduler never moves a chunk once sent, and a chunk
    # holding the heavy tests left one worker running alone for a third of
    # the suite (tests/unit/test_the_workers_share_the_end_of_the_suite.py).
    # Without -n xdist ignores it.
    --dist=worksteal
    # Coverage is opt-in (make test-coverage / CI passes --cov flags) —
    # pytest-cov adds ~25% runtime, so it stays out of the default run.

asyncio_mode = auto

# Test markers
markers =
    unit: unit tests
    integration: integration tests
    slow: slow tests
    async_db: tests that exercise real AsyncSession + asyncpg
    module: marks tests as module-specific (use @pytest.mark.module('name') to auto-create fixtures)

# Minimum Python version
minversion = 7.0

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # A name the library has retired warns on every request that reaches the
    # line, in a production log as readily as here, so bringing one back
    # fails the run instead. It has to be named: a blanket error would also
    # catch starlette's own testclient complaining about httpx, which is not
    # ours to answer.
    error:'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated
