services:

  # -----------------------------------------------------------------------
  # k6 — the test runner (Grafana Labs)
  # Does not start on its own — launched with `docker compose run`
  # -----------------------------------------------------------------------
  k6:
    image: grafana/k6:latest
    volumes:
      - ./load_tests/scenarios:/scenarios:ro
      # CSV generated by: docker compose exec backend uv run python seed_load_test_users.py
      - ./load_tests/users.csv:/users.csv:ro
    environment:
      K6_OUT: influxdb=http://influxdb:8086/k6
      BASE_URL: ${LOAD_TEST_URL:-http://host.docker.internal:8000}
      USERS_CSV: /users.csv
    depends_on:
      - influxdb
    extra_hosts:
      # Lets the container reach the host (e.g. a local dev server)
      - "host.docker.internal:host-gateway"
    networks:
      - loadtest-network
    profiles:
      - runner  # does not start on `up`, only through `run`

  # -----------------------------------------------------------------------
  # InfluxDB 1.x — stores the k6 metrics
  # k6 supports InfluxDB 1.x natively through K6_OUT=influxdb
  # -----------------------------------------------------------------------
  influxdb:
    image: influxdb:1.13-alpine
    restart: unless-stopped
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - influxdb_data:/var/lib/influxdb
    ports:
      # Bound to loopback: this InfluxDB runs with HTTP auth disabled.
      - "127.0.0.1:8086:8086"
    networks:
      - loadtest-network
    healthcheck:
      test: ["CMD", "influx", "-execute", "SHOW DATABASES"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------------
  # Grafana — visualises the results
  # k6 dashboard: import ID 2587 → Grafana → Dashboards → Import
  # -----------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin  # no login in the local environment
      GF_SERVER_HTTP_PORT: "3001"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./load_tests/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # Bound to loopback: anonymous access with the Admin role is on below.
      - "127.0.0.1:3001:3001"
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - loadtest-network

volumes:
  influxdb_data:
  grafana_data:

networks:
  loadtest-network:
    driver: bridge
