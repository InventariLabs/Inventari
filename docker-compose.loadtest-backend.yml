# Override for load testing with a configuration identical to the production VPS.
#
# Usage (stop the backend first so the image is rebuilt):
#   docker compose stop backend
#   docker compose -f docker-compose.yml -f docker-compose.loadtest-backend.yml up -d --build backend
#
# Restore dev mode afterwards:
#   docker compose up -d backend
#
# Target VPS spec (8 GB RAM, 4 cores):
#   - 2 cores reserved for PostgreSQL x2 + Redis
#   - WEB_CONCURRENCY=4 gunicorn+UvicornWorker workers
#   - 4 workers × 50 connections each (backend/app/database.py: the sync pool
#     20 + 10 overflow, the async pool 10 + 10) = 200 client connections →
#     PgBouncer (MAX_CLIENT_CONN 300, DEFAULT_POOL_SIZE 30) → PG (max_connections=50)

services:
  backend:
    # Overrides "command: uvicorn --reload" from docker-compose.yml
    # Forces the same command as the Dockerfile CMD (gunicorn + UvicornWorker)
    command: >
      gunicorn app.main:app
      --config gunicorn.conf.py
      --worker-class uvicorn.workers.UvicornWorker
      --workers 4
      --bind 0.0.0.0:8000
      --timeout 300
      --graceful-timeout 30
    environment:
      WEB_CONCURRENCY: "4"
      DEBUG: "false"
      # Rate limiter off, so the numbers measure the app and not slowapi. With
      # DEBUG=false the config refuses this combination unless it is acknowledged
      # explicitly — that guard is what keeps LOAD_TESTING=true from silently
      # reaching a real deployment (app/config.py).
      LOAD_TESTING: "true"
      LOAD_TESTING_ACK_UNSAFE: "true"
