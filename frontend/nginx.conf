server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # The Server header says "nginx" without the version, which would otherwise
    # tell a scanner which advisories to try.
    server_tokens off;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/manifest+json;

    # One ceiling for every body this server forwards, and it sits above
    # what the application accepts: MAX_REQUEST_BODY_SIZE is 51 MiB
    # (53,477,376 B) — the 50 MiB import plus 1 MiB of multipart framing —
    # and a ceiling under that answers with a bare 413 before the app's own
    # refusal can name the limit. `52m` is 54,525,952 B: that ceiling plus
    # a megabyte of headroom, and nginx's `m` is 1024², the same number
    # Caddy writes as `52MiB` (where `MB` is 10^6). The old `10m` was
    # 10,485,760 B — exactly what a ten-megabyte photograph weighs — so the
    # 204 bytes of multipart framing around it were enough for a 413.
    # Every upload route lives under /api, so this one number is the whole
    # answer for the SPA's proxy.
    client_max_body_size 52m;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    # script-src has no 'unsafe-inline': the production build emits no inline
    # script at all — every <script> in the built index.html carries a src,
    # including the service-worker registration — so the allowance bought
    # nothing and gave an injected <script> a way to run. It was the weakest
    # link in the stack: the API answers with a strict policy of its own and
    # Caddy adds HSTS, while the origin serving the application trusted any
    # inline script on the page.
    #
    # style-src keeps it. React writes `style` attributes, which that
    # directive covers, and moving the hole from scripts to styles is not
    # closing it — it is renaming it.
    #
    # base-uri and object-src come along because they are the two directives
    # that let an injection route around script-src: a planted <base> retargets
    # every relative script URL, and <object>/<embed> execute outside it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; worker-src 'self' blob:; connect-src 'self' https:; font-src 'self' data:; base-uri 'self'; object-src 'none'; frame-ancestors 'none';" always;

    # Scanners ask for /.env, /.git/config, /.aws/credentials. The build holds
    # no such file, but the SPA fallback answered them with index.html and a
    # 200, which a scanner counts as a hit. No route of the app has a segment
    # starting with a dot, so those paths end here. It must stay the first
    # regex location: nginx answers with the first regex that matches, and the
    # static-asset one below matches /.env.js as well.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Proxy API requests to backend.
    #
    # A location that only hands paths to the backend is `^~`. Without it
    # nginx settles on this prefix and then still asks the regex locations
    # below, answering with the first that matches: the static-asset one takes
    # any path ending in .jpg, .png or .svg, looks for it on disk and answers
    # 404. That is how every stored photo under /uploads came back 404 from
    # this container (Caddy routes /uploads/* itself, so only a deployment
    # without it saw that), and how a module's /api route ending in a file
    # name would. /public/ is not one: it also serves the SPA document, so it
    # stays under the regexes — the dot-segment 404 included — like `location
    # /`. backend/scripts/check_edge_public_routes.py holds both halves.
    location ^~ /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Public, unauthenticated API calls (/public/invitation/<code>,
    # /public/attestation/<token>). The attestation address is also a page of
    # the SPA, so a browser navigation (Accept: text/html) is handed back to
    # the SPA fallback — the split vite.config.ts makes for the dev server.
    # Without this location a fetch fell through to `location /` and read
    # index.html as a successful answer.
    location /public/ {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stored files are served from here (GET), not received — no upload
    # route lives under /uploads — so this location carries no ceiling of
    # its own and inherits the server's above. The second, lower number it
    # used to declare sat on a path that takes no bodies, and disagreed
    # with the ceiling every other request answers to. `^~`, like /api: a
    # stored file is a path ending in .jpg or .png.
    location ^~ /uploads {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve PWA manifest with correct MIME type
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Serve static files and handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker must NOT be cached aggressively (browser requirement for PWA).
    # nginx drops every server-level add_header the moment a location declares
    # one of its own, so the security set is repeated wherever Cache-Control
    # lives; backend/scripts/check_edge_public_routes.py keeps the copies equal.
    location = /sw.js {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; worker-src 'self' blob:; connect-src 'self' https:; font-src 'self' data:; base-uri 'self'; object-src 'none'; frame-ancestors 'none';" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # The SPA document is also served at /public/attestation/<token>, the very
    # address the page then GETs as JSON. A heuristically cacheable index.html
    # lets the browser answer that GET from its cache with the HTML it just
    # loaded, so the backend is never asked. `expires -1` (Cache-Control:
    # no-cache) makes the browser revalidate, and the revalidation carries
    # the JSON Accept header and reaches location /public/. It is `expires`
    # and not `add_header` on purpose: an add_header in this block would drop
    # the server-level security headers (CSP, X-Frame-Options) from the one
    # response that needs them most.
    location = /index.html {
        expires -1;
    }

    # Cache static assets. The security set is repeated because the
    # Cache-Control add_header below would otherwise drop every server-level one.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; worker-src 'self' blob:; connect-src 'self' https:; font-src 'self' data:; base-uri 'self'; object-src 'none'; frame-ancestors 'none';" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
