name: Release images

# Each v* tag publishes the three images docker-compose.prod.yml builds, to the
# GitHub Container Registry, for linux/amd64 and linux/arm64 (Raspberry Pi and
# other home servers are often ARM). docker-compose.images.yml pulls them.
#
# A manual run builds both architectures and publishes nothing: it is how a
# change to a Dockerfile is proved to build on arm64 before a tag depends on it.
#
# The first publish of an image creates its package as private. Set each of
# the three packages (inventari-backend, -frontend, -backup) to Public once in
# the organization's package settings; later releases keep the setting.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
          - image: frontend
            context: frontend
          - image: backup
            context: docker/backup
    steps:
      - uses: actions/checkout@v7

      # The compose file names the images by the version in backend/pyproject.toml
      # (scripts/init-env.sh writes it to .env), so a tag that disagrees with it
      # would publish images nobody's .env points at.
      - name: The tag is the version the tree declares
        if: github.ref_type == 'tag'
        run: |
          declared="v$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/pyproject.toml | head -n 1)"
          if [ "$declared" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, but backend/pyproject.toml says $declared." >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: the version (0.13.0, without the v — what INVENTARI_VERSION
      # holds), and `latest` unless the tag is a pre-release. The registry
      # path is lower-cased by the action, as the registry requires.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/inventari-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short,enable=${{ github.ref_type != 'tag' }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
