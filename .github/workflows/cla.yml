name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, closed, synchronize, labeled, unlabeled]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  # The trivial-contribution waiver (CLA.md §6) is the `cla: trivial` label.
  # Only people with triage or write access can apply a label, so the waiver is
  # always a maintainer's decision: a contributor asks for it, and nothing the
  # contributor controls (the title, the description) grants it.
  cla-assistant:
    runs-on: ubuntu-latest
    # Any other label runs the check too, rather than being filtered out here:
    # a skipped job leaves a "skipped" check on the head commit that hides the
    # failed one before it, and GitHub counts a skipped required check as passed.
    if: |
      (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA.') ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.action != 'closed'
      )
    steps:
      # Nothing here checks out or runs the pull request's code: under
      # pull_request_target this job holds a write token.
      - name: Maintainer waiver for a trivial contribution
        id: waiver
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const label = 'cla: trivial';
            const pr = context.payload.pull_request;
            // Read the labels live, not from the event: a re-run (the CLA
            // action re-runs the last failed run once the author signs)
            // replays the old payload.
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
            let waived = labels.some((l) => l.name === label);

            // The waiver covers the commits the maintainer looked at. New
            // commits withdraw it, and the signature check below runs on
            // them until a maintainer labels the pull request again.
            // GitHub sends no `synchronize` for a push to a closed pull
            // request, so the commits pushed while it was closed only show
            // up on `reopened`: that withdraws the waiver too.
            if (waived && ['synchronize', 'reopened'].includes(context.payload.action)) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                name: label,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body:
                  `New commits may have been pushed after a maintainer waived the CLA (the pull ` +
                  `request was updated or reopened), so the \`${label}\` label has been removed and ` +
                  `the signature check applies again. A maintainer can label the pull request ` +
                  `again if it is still a trivial contribution.`,
              });
              waived = false;
            }

            if (waived) {
              core.notice(`A maintainer applied \`${label}\`: CLA signature not required (CLA.md §6).`);
            }
            core.setOutput('waived', String(waived));

      - name: CLA Assistant
        if: steps.waiver.outputs.waived != 'true'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ASSISTANT_PAT }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/InventariLabs/Inventari/blob/main/CLA.md'
          branch: 'main'
          allowlist: dependabot[bot],renovate[bot],github-actions[bot],jerzypiatek
          create-file-commit-message: 'chore: add CLA signatures file'
          signed-commit-message: 'chore: $contributorName signed the CLA'
          custom-notsigned-prcomment: |
            ## Contributor License Agreement

            Thank you for your contribution to Inventari! Before we can merge this pull request,
            we need you to sign our [Contributor License Agreement](https://github.com/InventariLabs/Inventari/blob/main/CLA.md).

            Signing takes 5 seconds — just add this comment to this PR:

            ```
            I have read the CLA Document and I hereby sign the CLA.
            ```

            This grants Jerzy Piątek the rights needed for dual licensing (open-source + commercial),
            while you retain full copyright over your contributions.

            > **Trivial contribution?** If your change is only a typo fix, a formatting correction or
            > similarly minor (see [§6 of the CLA](https://github.com/InventariLabs/Inventari/blob/main/CLA.md#6-trivial-contributions)),
            > say so in a comment and a maintainer will look at it. If they agree, they apply the
            > `cla: trivial` label and the signature is not required. New commits pushed after that
            > remove the label, and the maintainer decides again.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA.'
          custom-allsigned-prcomment: '✅ All contributors have signed the CLA. Thank you!'
